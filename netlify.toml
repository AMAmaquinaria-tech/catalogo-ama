# Sitio estático (sin build). Netlify publica la raíz del repo tal cual.
[build]
  publish = "."

# Cache larga para imágenes: los navegadores no vuelven a descargarlas.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# La dirección vieja de Netlify lleva al dominio propio (antes mostraba la página completa)
[[redirects]]
  from = "https://ama-catalogo.netlify.app/*"
  to = "https://amamaquinaria.com/:splat"
  status = 301
  force = true

# Catálogo para Meta (fuente programada): que no salga en Google y que Meta siempre lea la versión nueva
[[headers]]
  for = "/catalogo-meta.csv"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/csv; charset=utf-8"
